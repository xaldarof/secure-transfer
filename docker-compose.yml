# Local:      docker compose up --build   ->  http://localhost:8080
# Production: put a TLS-terminating reverse proxy in front (see deploy/ and README), set
#             APP_ALLOWED_ORIGINS=https://your.domain and SERVER_FORWARD_HEADERS_STRATEGY=native.
services:
  app:
    build: .
    image: secure-transfer:latest
    ports:
      - "${HOST_BIND:-127.0.0.1}:${HOST_PORT:-8080}:8080"
    environment:
      APP_ALLOWED_ORIGINS: ${APP_ALLOWED_ORIGINS:-http://localhost:8080}
      APP_SESSION_TTL: ${APP_SESSION_TTL:-5m}
      APP_JOIN_TIMEOUT: ${APP_JOIN_TIMEOUT:-10s}
      APP_MAX_SESSIONS: ${APP_MAX_SESSIONS:-10000}
      APP_SESSIONS_PER_MINUTE_PER_IP: ${APP_SESSIONS_PER_MINUTE_PER_IP:-30}
      APP_CONNECTIONS_PER_MINUTE_PER_IP: ${APP_CONNECTIONS_PER_MINUTE_PER_IP:-60}
      SERVER_FORWARD_HEADERS_STRATEGY: ${SERVER_FORWARD_HEADERS_STRATEGY:-none}
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    ulimits:
      core: 0
    mem_limit: 512m
    restart: unless-stopped
