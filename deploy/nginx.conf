# nginx: TLS termination + WebSocket upgrade. Run the app with
#   APP_ALLOWED_ORIGINS=https://secrets.example.com SERVER_FORWARD_HEADERS_STRATEGY=native
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

limit_req_zone $binary_remote_addr zone=st_ws:10m rate=60r/m;

server {
    listen 80;
    server_name secrets.example.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name secrets.example.com;

    ssl_certificate     /etc/letsencrypt/live/secrets.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/secrets.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    access_log off;                # avoid retaining session IDs
    client_max_body_size 64k;

    location /ws/ {
        limit_req zone=st_ws burst=20 nodelay;
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;     # overwrite, do not append client-supplied values
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 360s;   # > session TTL; server also pings every 20 s
        proxy_send_timeout 360s;
        proxy_buffering off;
    }

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
